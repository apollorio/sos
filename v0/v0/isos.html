<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>ISO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .glow-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 48%,
        rgba(42, 16, 72, 0.55) 0%,
        rgba(24, 10, 48, 0.42) 38%,
        rgba(10, 4, 20, 0.28) 72%,
        transparent 100%
      );
    }

    .glow-container::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 34%, rgba(5, 2, 8, 0.65) 100%);
    }

    .ball {
      --delay: 0s;
      --size: 0.52;
      --speed: 20s;
      aspect-ratio: 1;
      width: calc(165% * var(--size));
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      animation: loop var(--speed) infinite linear;
      animation-delay: var(--delay);
      transform-origin: 50% 50%;
      will-change: transform;
      filter: blur(11vmin) saturate(1.1) brightness(0.92);
    }

    .ball--pink {
      background: linear-gradient(235deg, rgba(224, 56, 224, 0.78) 0%, rgba(184, 24, 200, 0.58) 40%, rgba(112, 16, 160, 0.45) 100%);
      opacity: 0.66;
      filter: blur(11vmin) saturate(1.12) brightness(0.94);
    }

    .ball--cyan {
      background: linear-gradient(118deg, rgba(64, 216, 216, 0.72) 0%, rgba(0, 184, 184, 0.55) 38%, rgba(0, 120, 136, 0.42) 100%);
      opacity: 0.64;
      filter: blur(11vmin) saturate(1.12) brightness(0.92);
    }

    @keyframes loop {
      0%   { transform: translate3d(0%, 51%, 0) rotate(0deg); }
      5%   { transform: translate3d(8%, 31%, 0) rotate(18deg); }
      10%  { transform: translate3d(22%, 13%, 0) rotate(36deg); }
      15%  { transform: translate3d(40%, 2%, 0) rotate(54deg); }
      20%  { transform: translate3d(46%, 21%, 0) rotate(72deg); }
      25%  { transform: translate3d(50%, 47%, 0) rotate(90deg); }
      30%  { transform: translate3d(53%, 80%, 0) rotate(108deg); }
      35%  { transform: translate3d(59%, 98%, 0) rotate(125deg); }
      40%  { transform: translate3d(84%, 89%, 0) rotate(144deg); }
      45%  { transform: translate3d(92%, 68%, 0) rotate(162deg); }
      50%  { transform: translate3d(99%, 47%, 0) rotate(180deg); }
      55%  { transform: translate3d(97%, 21%, 0) rotate(198deg); }
      60%  { transform: translate3d(80%, 7%, 0) rotate(216deg); }
      65%  { transform: translate3d(68%, 25%, 0) rotate(234deg); }
      70%  { transform: translate3d(59%, 41%, 0) rotate(251deg); }
      75%  { transform: translate3d(50%, 63%, 0) rotate(270deg); }
      80%  { transform: translate3d(38%, 78%, 0) rotate(288deg); }
      85%  { transform: translate3d(21%, 92%, 0) rotate(306deg); }
      90%  { transform: translate3d(3%, 79%, 0) rotate(324deg); }
      100% { transform: translate3d(0%, 51%, 0) rotate(360deg); }
    }

    body.paused .ball {
      animation-play-state: paused;
    }
  </style>
</head>
<body>
  <div class="glow-container" aria-hidden="true">
    <div class="ball ball--pink"></div>
    <div class="ball ball--cyan" style="--delay:-12s;--size:0.44;--speed:25s;"></div>
  </div>
  <script>
    (function() {
      window.addEventListener('message', function(e) {
        if (e.data === 'iso-pause') document.body.classList.add('paused');
        if (e.data === 'iso-play') document.body.classList.remove('paused');
      });
    })();
  </script>
</body>
</html>
