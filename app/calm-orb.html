<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Luz de respiração</title>
  <style>
    /* Breathing light: one soft core and a few embers drifting outward.
       Everything moves on transform/opacity only (compositor), shadows are static.
       Sizes are in vmin so the light scales with the square iframe. */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    .orb { position: absolute; inset: 0; overflow: hidden; border-radius: 50%; isolation: isolate;
      background: radial-gradient(circle at 50% 50%, #07101f 0%, #03070f 42%, #000 68%); }

    /* core glow: three soft lights (blue · violet · teal) drifting through each other,
       wide enough that the page's 4-2-6 scale (inhale grows, exhale shrinks) is easy to follow */
    .glow { position: absolute; inset: 0; border-radius: 50%; will-change: transform, opacity; }
    .glow--a { background:
        radial-gradient(circle at 58% 56%, rgba(214,226,255,.07), transparent 16%),
        radial-gradient(circle at 47% 42%, rgba(214,226,255,.06), transparent 12%),
        radial-gradient(circle at 50% 50%, rgba(96,170,245,.5) 0%, rgba(70,132,228,.28) 20%, rgba(46,84,176,.12) 38%, transparent 56%);
      animation: glow-a 7s ease-in-out infinite alternate; }
    .glow--b { background:
        radial-gradient(circle at 60% 58%, rgba(214,226,255,.05), transparent 15%),
        radial-gradient(circle at 42% 42%, rgba(214,226,255,.045), transparent 14%),
        radial-gradient(circle at 46% 52%, rgba(132,112,238,.44) 0%, rgba(104,88,214,.22) 22%, rgba(64,52,156,.09) 40%, transparent 58%);
      animation: glow-b 9s ease-in-out infinite alternate; }
    .glow--c { background:
        radial-gradient(circle at 55% 47%, rgba(84,206,214,.34) 0%, rgba(52,156,196,.16) 22%, rgba(30,96,150,.06) 38%, transparent 54%);
      animation: glow-c 11s ease-in-out infinite alternate; }
    @keyframes glow-a { 0% { transform: rotate(0deg) translate(0,0); opacity: 1; } 100% { transform: rotate(8deg) translate(1.5%,-1%); opacity: .45; } }
    @keyframes glow-b { 0% { transform: rotate(0deg) translate(0,0); opacity: .3; } 100% { transform: rotate(-10deg) translate(-2%,1.5%); opacity: 1; } }
    @keyframes glow-c { 0% { transform: rotate(0deg) translate(1%,1%); opacity: .2; } 100% { transform: rotate(12deg) translate(-1.5%,-2%); opacity: .85; } }

    /* embers */
    .particles { position: absolute; top: 30%; left: 30%; width: 40%; height: 40%; }
    .rotate, .particle { position: absolute; top: calc(50% - 2.2vmin); left: calc(50% - 2.2vmin); width: 4.4vmin; height: 4.4vmin; }
    .angle, .size, .position, .pulse { position: absolute; inset: 0; will-change: transform; }
    .rotate { animation: spin 40s linear infinite alternate; }
    .particle { top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle, rgba(222,236,255,.7) 0%, var(--c) 42%, transparent 72%);
      box-shadow: 0 0 5vmin 1vmin var(--h); }
    .pulse { animation: pulse 3s ease-in-out infinite alternate; }

    .angle:nth-child(1) { --c: rgba(66,146,236,.55); --h: rgba(66,146,236,.22); animation: spin 12s steps(5) infinite; }
    .angle:nth-child(1) .size { animation: size 12s steps(5) infinite; }
    .angle:nth-child(1) .position { animation: drift 3.2s cubic-bezier(.3,.1,.4,1) infinite; }

    .angle:nth-child(2) { --c: rgba(110,176,238,.5); --h: rgba(110,176,238,.2); animation: spin 7.4s steps(3) -2.4s infinite; }
    .angle:nth-child(2) .size { animation: size 7.4s steps(3) -2.4s infinite alternate; }
    .angle:nth-child(2) .position { animation: drift 2.6s cubic-bezier(.3,.1,.4,1) -1s infinite; }
    .angle:nth-child(2) .pulse { animation-delay: -1.2s; }

    .angle:nth-child(3) { --c: rgba(125,113,232,.5); --h: rgba(125,113,232,.2); animation: spin 16s steps(8) -8s infinite; }
    .angle:nth-child(3) .size { animation: size 10s steps(4) -7s infinite alternate; }
    .angle:nth-child(3) .position { animation: drift 2.9s cubic-bezier(.3,.1,.4,1) -2s infinite; }
    .angle:nth-child(3) .pulse { animation-delay: -2s; }

    .angle:nth-child(4) { --c: rgba(90,196,214,.42); --h: rgba(90,196,214,.16); animation: spin 19s steps(6) -5s infinite; }
    .angle:nth-child(4) .size { animation: size 9s steps(3) -3s infinite alternate; }
    .angle:nth-child(4) .position { animation: drift 3.6s cubic-bezier(.3,.1,.4,1) -.6s infinite; }
    .angle:nth-child(4) .pulse { animation-delay: -.5s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes size { 0% { transform: scale(.25); } 100% { transform: scale(.6); } }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(.55); } }
    @keyframes drift { 0% { transform: translate3d(0,0,0); opacity: 0; } 18% { opacity: .9; } 55% { opacity: .6; } 100% { transform: translate3d(22vmin,22vmin,0); opacity: 0; } }

    /* soft edge so the light dissolves into the page black */
    .veil { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 46%, rgba(0,0,0,.5) 62%, #000 71%); }

    html.paused * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; will-change: auto !important; }
      .glow--b { opacity: .5; }
      .particles { display: none; }
    }
  </style>
</head>
<body>
  <div class="orb" aria-hidden="true">
    <div class="glow glow--a"></div>
    <div class="glow glow--b"></div>
    <div class="glow glow--c"></div>
    <div class="particles">
      <div class="rotate">
        <div class="angle"><div class="size"><div class="position"><div class="pulse"><div class="particle"></div></div></div></div></div>
        <div class="angle"><div class="size"><div class="position"><div class="pulse"><div class="particle"></div></div></div></div></div>
        <div class="angle"><div class="size"><div class="position"><div class="pulse"><div class="particle"></div></div></div></div></div>
        <div class="angle"><div class="size"><div class="position"><div class="pulse"><div class="particle"></div></div></div></div></div>
      </div>
    </div>
    <div class="veil"></div>
  </div>
  <script>
    (() => {
      let parentPaused = false;
      const sync = () => document.documentElement.classList.toggle('paused', parentPaused || document.hidden);
      addEventListener('message', event => {
        if (event.source !== parent || !['iso-pause', 'iso-play'].includes(event.data)) return;
        parentPaused = event.data === 'iso-pause';
        sync();
      });
      document.addEventListener('visibilitychange', sync);
      sync();
    })();
  </script>
</body>
</html>
