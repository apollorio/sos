<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ISO</title>
  <!--
    Breathing orb — "abraço" palette (001-design).
    Pure #f0f / #0ff neon was replaced by a muted dawn pair: pearl-lavender and
    dusk-teal, low saturation, slow drift. Nothing flashes, nothing strobes —
    this orb may be watched by someone on psychedelics or mid-panic.
    Pauses on: parent 'iso-pause' message · hidden tab · prefers-reduced-motion.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .glow-container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      border-radius: 50%;
      background: radial-gradient(
        circle at 50% 46%,
        rgba(58, 46, 78, 0.55) 0%,
        rgba(32, 26, 46, 0.42) 40%,
        rgba(12, 10, 18, 0.3) 74%,
        transparent 100%
      );
    }

    /* soft inner light — the "someone is here" warmth at the centre */
    .glow-container::before {
      content: '';
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 214, 200, 0.16) 0%, transparent 70%);
      filter: blur(6vmin);
      pointer-events: none;
      z-index: 2;
    }

    .glow-container::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, transparent 38%, rgba(6, 5, 8, 0.62) 100%);
      z-index: 3;
    }

    .ball {
      --delay: 0s;
      --size: 0.52;
      --speed: 32s;
      aspect-ratio: 1;
      width: calc(165% * var(--size));
      border-radius: 50%;
      position: absolute;
      top: 0;
      left: 0;
      animation: loop var(--speed) infinite linear;
      animation-delay: var(--delay);
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* pearl-lavender (was #e038e0 magenta) */
    .ball--dawn {
      background: linear-gradient(235deg, rgba(196, 168, 214, 0.7) 0%, rgba(160, 132, 192, 0.52) 42%, rgba(104, 86, 142, 0.4) 100%);
      opacity: 0.62;
      filter: blur(11vmin) saturate(0.9);
    }

    /* dusk-teal (was #40d8d8 cyan) */
    .ball--tide {
      background: linear-gradient(118deg, rgba(140, 196, 196, 0.62) 0%, rgba(98, 158, 168, 0.48) 40%, rgba(64, 104, 120, 0.38) 100%);
      opacity: 0.58;
      filter: blur(11vmin) saturate(0.9);
    }

    @keyframes loop {
      0%   { transform: translate3d(0%, 51%, 0) rotate(0deg); }
      10%  { transform: translate3d(22%, 13%, 0) rotate(36deg); }
      20%  { transform: translate3d(46%, 21%, 0) rotate(72deg); }
      30%  { transform: translate3d(53%, 80%, 0) rotate(108deg); }
      40%  { transform: translate3d(84%, 89%, 0) rotate(144deg); }
      50%  { transform: translate3d(99%, 47%, 0) rotate(180deg); }
      60%  { transform: translate3d(80%, 7%, 0) rotate(216deg); }
      70%  { transform: translate3d(59%, 41%, 0) rotate(251deg); }
      80%  { transform: translate3d(38%, 78%, 0) rotate(288deg); }
      90%  { transform: translate3d(3%, 79%, 0) rotate(324deg); }
      100% { transform: translate3d(0%, 51%, 0) rotate(360deg); }
    }

    body.paused .ball { animation-play-state: paused; }

    @media (prefers-reduced-motion: reduce) {
      .ball { animation: none; transform: translate3d(28%, 34%, 0); }
      .ball--tide { transform: translate3d(58%, 52%, 0); }
    }
  </style>
</head>
<body>
  <div class="glow-container" aria-hidden="true">
    <div class="ball ball--dawn"></div>
    <div class="ball ball--tide" style="--delay:-18s;--size:0.44;--speed:40s;"></div>
  </div>
  <script>
    (function () {
      var parentPaused = false;
      function sync() {
        document.body.classList.toggle('paused', parentPaused || document.hidden);
      }
      window.addEventListener('message', function (e) {
        if (e.data === 'iso-pause') { parentPaused = true; sync(); }
        if (e.data === 'iso-play') { parentPaused = false; sync(); }
      });
      document.addEventListener('visibilitychange', sync);
    })();
  </script>
</body>
</html>
