<body>

<div class="ambient noise-texture" aria-hidden="true">
  <div class="aurora"></div>
  <div class="mote" style="width:2px;height:2px;top:14%;left:11%;--dur:22s;animation-delay:-5s"></div>
  <div class="mote" style="width:1px;height:1px;top:27%;left:77%;--dur:29s;animation-delay:-13s"></div>
  <div class="mote" style="width:2px;height:2px;top:43%;left:24%;--dur:19s;animation-delay:-4s"></div>
  <div class="mote" style="width:1px;height:1px;top:56%;left:67%;--dur:33s;animation-delay:-20s"></div>
  <div class="mote" style="width:2px;height:2px;top:71%;left:41%;--dur:21s;animation-delay:-9s"></div>
  <div class="mote" style="width:1px;height:1px;top:19%;left:54%;--dur:26s;animation-delay:-16s"></div>
  <div class="mote" style="width:2px;height:2px;top:82%;left:89%;--dur:24s;animation-delay:-7s"></div>
</div>

<!-- Ambient: piano clocks only — never autoplay; fade starts on tap -->
<audio id="relaxAudio"
  src="https://assets.apollo.rio.br/audio/clocks.flac"
  loop preload="metadata" playsinline></audio>

<header class="global-header" id="ui-header">
  <!-- Blcoked not display!!! 
   <div class="logo-mark">
    <i class="ri-heart-pulse-line" aria-hidden="true"></i>
    <span>Espaço Seguro</span>
  </div> --> 
  <div class="hdr-btns">
    
    <button type="button" class="btn-icon" id="btn-zen" aria-label="Modo foco: tela limpa, tela sempre acesa" aria-pressed="false">
      <i class="ri-eye-off-line" id="icon-zen" aria-hidden="true"></i>
    </button>

    <button type="button" class="btn-icon btn-audio" id="btn-audio" aria-label="Tocar som ambiente" aria-pressed="false">
      <span class="audio-icon-wrap">
        <i class="ri-disc-line audio-icon audio-icon--play" id="icon-audio-play" aria-hidden="true"></i>
        <i class="ri-album-line audio-icon audio-icon--pause" id="icon-audio-pause" aria-hidden="true"></i>
      </span>
    </button>

  </div>
</header>

<section class="orb-zone" id="orb-zone" aria-label="Âncora de respiração">
  <div class="breathe-label" id="breathe-txt" aria-live="polite"></div>
  <div class="orb-shell">
    <div class="orb-stage" id="orb-stage">
      <div class="orb-aura" id="orb-aura" aria-hidden="true"></div>
      <iframe
        class="magic-ball breathe"
        id="orb"
        src="./isos.html?v=001"
        title=""
        role="img"
        aria-label="Esfera de respiração"
        tabindex="-1"
        loading="eager"></iframe>
      <div class="orb-rim" id="orb-rim" aria-hidden="true"></div>
    </div>
  </div>
  <p class="breathe-sub" id="breathe-sub">toque em qualquer lugar para começar</p>
</section>

<div class="warm-toast" id="warm-toast" role="status" aria-live="polite"></div>

<!-- Static fallback buttons — always visible even if JS fetch fails -->
<nav class="options-zone" id="ui-options" aria-label="Opções de suporte">
  <button type="button" class="option-box" data-flow="torto">
    <span class="opt-icon" aria-hidden="true">
      <i class="ri-capsule-fill"></i>
    </span>
    <span class="opt-title">Bateu Forte</span>
    <span class="opt-sub">Usei algo..</span>
  </button>
  <button type="button" class="option-box" data-flow="panico">
    <span class="opt-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M 18.799 8.963 L 21.05 12.502 C 21.198 12.735 21.168 13.083 20.825 13.23 L 18.865 14.07 L 18.865 16.999 C 18.865 18.103 17.97 18.999 16.865 18.999 L 14.866 18.999 L 14.865 21.999 L 5.865 21.999 L 5.866 18.305 C 5.866 17.124 5.429 16.007 4.621 15 C 3.523 13.63 2.865 11.891 2.865 9.999 C 2.865 5.643 6.345 2.102 10.676 2.001 L 6.332 8.276 L 10.269 8.276 L 10.269 13.339 L 15.332 6.026 L 11.394 6.026 L 11.394 2.016 C 15.221 2.266 18.313 5.205 18.799 8.963 Z"></path></svg>

    <span class="opt-title">Pânico</span>

    <span class="opt-icon" aria-hidden="true">
      <i class="ri-treasure-map-fill"></i>
    </span>
    <span class="opt-title">Onde eu tô?</span>
    <span class="opt-sub">Irrealidade</span>
  </button>
  <button type="button" class="option-box" data-flow="trava">
    <span class="opt-icon" aria-hidden="true">
      <i class="ri-body-scan-fill"></i>
    </span>
    <span class="opt-title">Paranoia</span>
    <span class="opt-sub">Medo constante</span>
  </button>
  <button type="button" class="option-box" data-flow="falar">

    </span>
    <span class="opt-title">Solidão</span>
    <span class="opt-sub">Desespero</span>
  </button>
  <button type="button" class="option-box" data-flow="samu">
    <span class="opt-icon" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M 10.064 9.142 L 12.314 9.142 L 12.314 10.642 L 10.064 10.642 L 10.064 12.892 L 8.564 12.892 L 8.564 10.642 L 6.314 10.642 L 6.314 9.142 L 8.564 9.142 L 8.564 6.892 L 10.064 6.892 Z M 8.965 17 C 8.722 18.696 7.263 20 5.5 20 C 3.737 20 2.278 18.696 2.036 17 L 1 17 L 1 5 C 1 4.448 1.448 4 2 4 L 16 4 C 16.552 4 17 4.448 17 5 L 17 7 L 20 7 L 23 11.056 L 23 17 L 20.965 17 C 20.722 18.696 19.263 20 17.5 20 C 15.737 20 14.278 18.696 14.036 17 Z M 15 6 L 3 6 L 3 14.05 C 3.635 13.402 4.521 13 5.5 13 C 6.896 13 8.102 13.817 8.663 15 L 14.337 15 C 14.505 14.647 14.73 14.326 15 14.05 Z M 17 12 L 21 12 L 21 11.715 L 18.992 9 L 17 9 Z M 17.5 18 C 18.153 18 18.709 17.582 18.915 17 C 18.97 16.843 19 16.675 19 16.5 C 19 15.671 18.329 15 17.5 15 C 16.672 15 16 15.671 16 16.5 C 16 16.675 16.03 16.843 16.086 17 C 16.291 17.582 16.847 18 17.5 18 Z M 7 16.5 C 7 15.671 6.329 15 5.5 15 C 4.672 15 4 15.671 4 16.5 C 4 16.675 4.03 16.843 4.086 17 C 4.291 17.582 4.847 18 5.5 18 C 6.153 18 6.709 17.582 6.915 17 C 6.97 16.843 7 16.675 7 16.5 Z"></path></svg>
    </span>
    <span class="opt-title">Resgate</span>
    <span class="opt-sub">Urgência</span>
  </button>
</nav>

<!-- Static safety line: plain tel: links, work even if every script fails -->
<div class="sos-strip" role="navigation" aria-label="Ajuda por telefone">
