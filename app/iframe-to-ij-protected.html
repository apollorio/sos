<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apollo • Secure Module</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --accent: #00ff9d;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      
      width: 100dvw;
      max-width: 100%;
      height: 100dvh;
      max-height: 100%;
    }

html, body {
  scrollbar-width: none;
  -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}

    #frame-container {
      width: 100dvw;
      max-width: 100%;
      height: 100dvh;
      max-height: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
      border: 1px solid #222;
    }
    iframe {
      width: 100dvw;
      max-width: 100%;
      height: 100dvh;
      max-height: 100%;
      
      border: none;
      background: #111;
    }
  </style>
</head>
<body>
  <div id="frame-container"></div>
  <script>
    (function() {
      const _p = atob('aWouaHRtbA==');

      const frame = document.createElement('iframe');

      frame.sandbox = [
        'allow-scripts',
        'allow-same-origin',
        'allow-forms',
        'allow-popups',
        'allow-popups-to-escape-sandbox'
      ].join(' ');

      frame.setAttribute('loading', 'lazy');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('credentialless', '');

      frame.src = _p;

      const container = document.getElementById('frame-container');
      container.appendChild(frame);

      frame.onload = () => {
        try {
          frame.contentWindow.postMessage({ type: 'parent-ready' }, '*');
        } catch (e) {}
      };
    })();
  </script>
</body>
</html>
